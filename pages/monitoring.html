<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Monitoring · Uniform Compliance</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/monitoring.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar"></div>
    <div class="app-main">
      <div id="header"></div>
      <main class="app-content">
        <div class="monitoring-layout">

          <section class="card monitoring-feed-card">
            <div class="monitoring-feed">
              <div class="monitoring-feed-placeholder">
                <span class="monitoring-feed-icon">&#128247;</span>
                <span>Main Gate Camera Feed (simulated — no real video)</span>
              </div>
              <div class="monitoring-scanline" aria-hidden="true"></div>
            </div>
            <div class="monitoring-controls">
              <div class="monitoring-status" id="monitoring-status">
                <span class="monitoring-status-dot" id="monitoring-status-dot"></span>
                <span id="monitoring-status-text">Idle</span>
              </div>
              <button type="button" class="btn btn-primary" id="monitoring-toggle">
                Start Monitoring
              </button>
            </div>
          </section>

          <section class="card monitoring-result-card">
            <h2>Latest Detection</h2>
            <div id="monitoring-result-content">
              <div class="placeholder-block">
                No detections yet. Click "Start Monitoring" to simulate the
                camera picking up students at the Main Gate.
              </div>
            </div>
          </section>

          <section class="card monitoring-recent-card">
            <h2>Recent Detections</h2>
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Detected</th>
                  <th>Time</th>
                  <th>Status</th>
                  <th>Confidence</th>
                </tr>
              </thead>
              <tbody id="monitoring-recent-body"></tbody>
            </table>
          </section>

        </div>
      </main>
    </div>
  </div>

  <script src="../js/data/mock-data.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/stat-card.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/monitoring.js"></script>
</body>
</html>
