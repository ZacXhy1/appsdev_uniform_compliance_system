<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detections · Uniform Compliance</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/detections.css" />
  <script src="../js/auth.js"></script>
  <script>requireAuth();</script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar"></div>
    <div class="app-main">
      <div id="header"></div>
      <main class="app-content">

        <div class="detections-toolbar">
          <input
            type="text"
            id="detections-search"
            class="input"
            placeholder="Search by detection ID or student label…"
          />
          <select id="detections-status-filter" class="select">
            <option value="all">All Statuses</option>
            <option value="compliant">Compliant</option>
            <option value="violation">Violation</option>
            <option value="pending">Pending Review</option>
          </select>
          <select id="detections-sort" class="select">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>

        <p class="detections-count" id="detections-count"></p>

        <div class="card" id="detections-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Detected</th>
                <th>Time</th>
                <th>Status</th>
                <th>Confidence</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="detections-table-body"></tbody>
          </table>
        </div>

        <div class="card placeholder-block" id="detections-empty" hidden>
          No detections match your search or filters. Try adjusting them.
        </div>

      </main>
    </div>
  </div>

  <script src="../js/data/mock-data.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/stat-card.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/detections.js"></script>
</body>
</html>
