<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports · Uniform Compliance</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/reports.css" />
  <script src="../js/auth.js"></script>
  <script src="../js/settings.js"></script>
  <script>requireAuth();</script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar"></div>
    <div class="app-main">
      <div id="header"></div>
      <main class="app-content">

        <div class="reports-toolbar">
          <label class="reports-filter-label" for="reports-date-filter">Date range</label>
          <select id="reports-date-filter" class="select">
            <option value="all">All Dates</option>
          </select>
        </div>

        <div class="stats-grid" id="reports-stats"></div>

        <div class="reports-grid">
          <div class="card reports-chart-card">
            <h2>Compliance Overview</h2>
            <p class="form-hint" id="reports-overview-subtitle"></p>
            <div class="reports-chart-row">
              <div class="reports-donut" id="reports-donut">
                <div class="reports-donut-center" id="reports-donut-center"></div>
              </div>
              <div class="reports-donut-legend" id="reports-donut-legend"></div>
            </div>
          </div>

          <div class="card reports-summary-card">
            <h2>Summary Report</h2>
            <p id="reports-summary-text"></p>
            <ul class="reports-insights" id="reports-insights"></ul>
          </div>
        </div>

        <div class="card reports-trend-card">
          <h2>Detections by Date</h2>
          <p class="form-hint">
            Every detection recorded at the <span id="reports-trend-camera-label"></span> checkpoint,
            grouped by day — always shows the full session regardless of the date filter above.
          </p>
          <div id="reports-trend-list"></div>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/data/mock-data.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/stat-card.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/reports.js"></script>
</body>
</html>
