<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Uniform Compliance</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/login.css" />
  <script src="../js/auth.js"></script>
  <script>
    // If a demo session is already active, skip the form entirely.
    // Runs synchronously in <head> so there's no flash of the login form.
    if (isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</head>
<body>
  <main class="login-page">
    <div class="card login-card">
      <div class="login-brand">
        <span class="sidebar-brand-mark"></span>
        <h1>Uniform Compliance</h1>
      </div>
      <p>Sign in to the monitoring dashboard.</p>

      <p id="loginError" class="form-error" hidden></p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary login-submit">Log In</button>
      </form>

      <p class="form-hint login-demo-note">
        Demo build — not real security. Use <strong>admin</strong> /
        <strong>admin123</strong>.
      </p>
    </div>
  </main>

  <script src="../js/pages/login.js"></script>
</body>
</html>
